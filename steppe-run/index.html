<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#caa84a" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>Степовий Забіг</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="game">
    <canvas id="gl"></canvas>

    <!-- Room transition fade -->
    <div id="fade"></div>

    <!-- FPS meter -->
    <div id="fps">– fps</div>

    <!-- Coordinate/frame recorder (2.5s burst into the log) -->
    <button id="recBtn">REC</button>

    <!-- HUD -->
    <div id="hud" class="hidden">
      <div id="topbar">
        <div id="hpwrap">
          <div id="hpbar"><div id="hpfill"></div></div>
          <span id="hplabel">100</span>
        </div>
        <div id="stats">
          <span id="waveLabel">Хвиля 1</span>
          <span id="killLabel">☠ 0</span>
          <span id="coinLabel">₴ 0</span>
        </div>
      </div>
      <div id="banner" class="hidden"></div>
    </div>

    <!-- Virtual joystick -->
    <div id="stick" class="hidden">
      <div id="stickBase"></div>
      <div id="stickKnob"></div>
    </div>

    <!-- Menu -->
    <div id="menu" class="overlay">
      <h1>СТЕПОВИЙ<br/>ЗАБІГ</h1>
      <p class="sub">Голі, босі та геть безпорадні.<br/>Скільки хвиль протримаєшся?</p>
      <button id="startBtn" class="btn">ПОЧАТИ ЗАБІГ</button>
      <button id="shopBtn" class="btn btn2">АРСЕНАЛ · <span id="menuBank">0</span> ₴</button>
      <p class="best" id="menuBest"></p>
      <p class="hint">Тягни пальцем будь-де ліворуч/знизу — стрільба автоматична.</p>
    </div>

    <!-- Perk selection -->
    <div id="perks" class="overlay hidden">
      <h2>ХВИЛЮ ПРОЙДЕНО!</h2>
      <p class="sub">Обери апгрейд для забігу:</p>
      <div id="perkCards"></div>
    </div>

    <!-- Death screen -->
    <div id="death" class="overlay hidden">
      <h2>ЗАБІГ ЗАВЕРШЕНО</h2>
      <div id="deathStats"></div>
      <button id="retryBtn" class="btn">НОВИЙ ЗАБІГ</button>
      <button id="toMenuBtn" class="btn btn2">В МЕНЮ · АРСЕНАЛ</button>
    </div>

    <!-- Meta shop: permanent upgrades for banked coins -->
    <div id="shop" class="overlay hidden">
      <h2>АРСЕНАЛ</h2>
      <p class="sub">Скарбничка: <b id="shopBank">0</b> ₴<br/><small>Трофеї з ворогів зберігаються між забігами</small></p>
      <div id="shopCards"></div>
      <button id="shopBack" class="btn btn2">НАЗАД</button>
    </div>
  </div>

  <script src="js/devlog.js"></script>
  <script type="module" src="js/main.js"></script>
  <script>if ('serviceWorker' in navigator && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) { addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {})); }</script>
</body>
</html>
